appId: com.curso.shopdemo
name: Login via IA - ShopDemo
env:
  EMAIL: ${EMAIL || "cliente@shopdemo.com"}
  SENHA: ${SENHA || "123456"}
---
# 1. Abre o app com estado limpo
- launchApp:
    clearState: true

# 2. Login (seletores obtidos da hierarquia da tela: tela-login)
- extendedWaitUntil:
    visible:
      id: "input-email"
    timeout: 60000
- tapOn:
    id: "input-email"
- inputText: ${EMAIL}
- tapOn:
    id: "input-senha"
- inputText: ${SENHA}
# Fecha o teclado sem usar BACK (hideKeyboard fecha o app no Android)
- pressKey: Enter
- tapOn:
    id: "btn-entrar"

# 3. Confirma que o catalogo de produtos aparece
- extendedWaitUntil:
    visible:
      id: "tela-catalogo"
    timeout: 40000
- assertVisible:
    id: "lista-produtos"
