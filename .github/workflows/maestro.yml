name: Maestro Suite

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adbkey
          key: avd-34-x86_64-default-pixel4

      - name: Gerar snapshot do AVD
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Snapshot do AVD gerado para cache."

      - name: Subir emulador e rodar suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics 
          script: |
            # Instala o Maestro dentro do container, com a versao fixada na MESMA linha.
            # Cada linha do script roda num shell separado, export nao persiste entre linhas.
            export MAESTRO_VERSION=2.7.0 && curl -Ls "https://get.maestro.mobile.dev" | bash

            # Checkpoint: usa o caminho absoluto do binario, sem depender de PATH
            "$HOME/.maestro/bin/maestro" --version

            # Suprime dialogos de ANR/crash que cobrem a tela do app
            adb shell settings put global hide_error_dialogs 1
            adb shell wm dismiss-keyguard

            # Instala o APK
            adb install ShopDemo.apk

            # Gera o relatorio
            mkdir -p reports
            cd flows/s3-suite-shopdemo && "$HOME/.maestro/bin/maestro" test --format junit --output ../../reports/resultado.xml .
        env:
          # Da 3 minutos para o driver do Maestro subir no emulador lento
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
          MAESTRO_CLI_NO_ANALYTICS: "1"

      - name: Publicar relatorio JUnit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-maestro
          path: reports/resultado.xml

      - name: Publicar screenshots
        if: always() && hashFiles('.maestro/screenshots/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-maestro
          path: .maestro/screenshots/

      - name: Exibir resultado no Actions
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maestro Suite
          path: reports/resultado.xml
          reporter: java-junit
          fail-on-error: false